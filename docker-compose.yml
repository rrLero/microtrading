services:
  db:
    image: postgres:16-alpine
    container_name: microtrading-db
    environment:
      POSTGRES_USER: micro
      POSTGRES_PASSWORD: micro
      POSTGRES_DB: microtrading
    ports:
      # Host port 55432: 5432 has a local Postgres, 5433 has an SSH tunnel on this machine
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micro -d microtrading"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
